<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GURPS Express — Лист персонажа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Exo+2:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Play:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem("ge.ui.theme");
        var mode = localStorage.getItem("ge.ui.mode");
        if (theme !== "base" && theme !== "fantasy" && theme !== "scifi") theme = "base";
        if (mode !== "light" && mode !== "dark") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.dataset.theme = theme;
        root.dataset.mode = mode;
        root.style.colorScheme = mode;
      } catch (error) {
        document.documentElement.dataset.theme = "base";
        document.documentElement.dataset.mode = "light";
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
